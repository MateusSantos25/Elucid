# Elucid: toda vez que você enviar código para o GitHub, este roteiro roda todos os testes sozinho.
# Se algo quebrar, aparece um X vermelho na aba "Actions" do repositório.
name: Testes do Elucid

on:
  push:
  pull_request:

# As ações abaixo estão fixadas pelo commit exato (o comentário mostra a versão), para uma atualização
# maliciosa ou com defeito de alguma delas não entrar nos testes sem você perceber.
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preparar o Node (para os testes do motor)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Preparar o Python (para o construir.py e os testes de navegador)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Conferir se o elucid.html está atualizado
        run: |
          python construir.py
          if ! git diff --quiet -- elucid.html publicar/site/index.html; then
            echo "::error::O elucid.html está desatualizado. Rode 'python construir.py' e envie de novo."
            exit 1
          fi

      - name: Testar o motor (contas iguais às do pandas)
        run: node testes/test_nucleo.js

      - name: Testar a função da Netlify
        run: node testes/test_servidor.mjs

      - name: Instalar o navegador de testes (Playwright)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Testes de navegador
        run: |
          for t in testes/e2e_*.py; do
            echo "=== $t"
            python "$t"
          done

      - name: Guardar as capturas de tela
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
